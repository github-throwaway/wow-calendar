name: WOW-Kalender aktualisieren
on:
  schedule:
    - cron: "0 4 * * *"   # täglich ca. 5/6 Uhr deutscher Zeit
  workflow_dispatch:       # manuell startbar
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 wow_kalender.py ludwigshafen-wow.ics
      - run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add ludwigshafen-wow.ics
          git diff --cached --quiet || git commit -m "Kalender aktualisiert"
          git push
